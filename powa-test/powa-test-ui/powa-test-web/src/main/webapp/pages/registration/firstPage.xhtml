<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/WEB-INF/templates/global-template.xhtml">

	<ui:define name="content-inner">
		<h2>User Registration</h2>
		<h:form id="registrationForm">
			<div class="row">
				<h:outputLabel styleClass="span4">First Name</h:outputLabel>
				<h:inputText id="firstName" styleClass="span8 input-small"
					value="#{registration.form.firstName}" size="10" maxlength="64"
					title="First Name" />
			</div>


			<div class="row">
				<h:outputLabel styleClass="span4">Last Name</h:outputLabel>
				<h:inputText id="lastName" styleClass="span8 input-small"
					value="#{registration.form.lastName}" size="10" maxlength="64"
					title="Last Name" />
			</div>
			
			<div class="row">
				<h:outputLabel styleClass="span4">Email</h:outputLabel>
				<h:inputText id="email" styleClass="span8 input-small"
					value="#{registration.form.email}" size="10" maxlength="64"
					title="Email" />
			</div>
			
			<div class="row">
				<h:outputLabel styleClass="span4">Mobile</h:outputLabel>
				<h:inputText id="mobile" styleClass="span8 input-small"
					value="#{registration.form.mobile}" size="10" maxlength="64"
					title="Mobile" />
			</div>
			
			<div class="row">
				<h:outputLabel styleClass="span4">Password</h:outputLabel>
				<h:inputSecret id="password" styleClass="span8 input-small"
					value="#{registration.form.password}" size="10" maxlength="64"
					title="Password" />
			</div>
			
			<div class="row">
				<h:outputLabel styleClass="span4">Confirm Password</h:outputLabel>
				<h:inputSecret id="confirmPassword" styleClass="span8 input-small"
					value="#{registration.form.confirmPassword}" size="10" maxlength="64"
					title="Confirm Password" />
			</div>

			<div>
				<h:commandButton type="value" value="Next"
					action="#{registration.toSecondPage()}" styleClass="btn btn-primary" />
			</div>
		</h:form>
	</ui:define>

</ui:composition>
