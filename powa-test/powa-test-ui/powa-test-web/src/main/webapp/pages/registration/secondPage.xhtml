<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	template="/WEB-INF/templates/global-template.xhtml">

	<ui:define name="content-inner">
		<h2>Address Information</h2>
		<h:form id="registrationForm">
			<div class="row">
				<h:outputLabel styleClass="span4">Address Line 1</h:outputLabel>
				<h:inputText id="address1" styleClass="span8 input-small"
					value="#{registration.form.address1}" size="10" maxlength="64"
					title="Address Line 1" />
			</div>


			<div class="row">
				<h:outputLabel styleClass="span4">Address Line 2</h:outputLabel>
				<h:inputText id="address2" styleClass="span8 input-small"
					value="#{registration.form.address2}" size="10" maxlength="64"
					title="Address Line 2" />
			</div>

			<div class="row">
				<h:outputLabel styleClass="span4">City</h:outputLabel>
				<h:inputText id="city" styleClass="span8 input-small"
					value="#{registration.form.city}" size="10" maxlength="64"
					title="City" />
			</div>
			
			<div class="row">
				<h:outputLabel styleClass="span4">State/Province</h:outputLabel>
				<h:inputText id="state" styleClass="span8 input-small"
					value="#{registration.form.state}" size="10" maxlength="64"
					title="State" />
			</div>

			<div class="row">
				<h:outputLabel styleClass="span4">Country</h:outputLabel>
				<h:selectOneMenu id="country" styleClass="span8 input-small"
					value="#{registration.form.country}" size="10" maxlength="64"
					title="Country">
					<f:selectItems
						value="#{registration.staticDataService.countryAlpha3Code}" />
				</h:selectOneMenu>
			</div>

			<div>
				<h:commandButton type="value" value="Back"
					action="#{registration.toFirstPage()}" styleClass="btn" />
				<h:commandButton type="value" value="Next"
					action="#{registration.toThirdPage()}" styleClass="btn btn-primary" />
			</div>
		</h:form>
	</ui:define>

</ui:composition>
